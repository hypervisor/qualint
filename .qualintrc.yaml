include:
  - src/**/*
  - test/**/*
  - scripts/**/*

overrides:
  # AST walkers dispatch on node type, so they are switch-heavy by nature.
  - files:
      - src/analysis/control-flow.ts
      - src/analysis/function-context.ts
      - src/analysis/npath.ts
      - src/files/glob.ts
    rules:
      complexity/cyclomatic: [error, { max: 55 }]
      complexity/cognitive: [error, { max: 60 }]
      complexity/npath: [error, { max: 1000 }]
      size/function: [error, { max: 150 }]
      size/statements: [error, { max: 100 }]
  # describe() callbacks are as long as the suite.
  - files: ['**/*.test.ts']
    rules:
      size/function: off
      size/statements: [error, { max: 60 }]
      # Parameterised cases legitimately look alike.
      duplicate/function: off
